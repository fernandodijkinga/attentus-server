{# BCS shared design system: macros + styles. Use:
   {% from "_bcs_layout.html" import bcs_styles, bcs_tabs %}
#}

{% macro bcs_styles() -%}
<style>
/* ======================================================
   BCS DESIGN SYSTEM (Perspicuus BCS)
   Prefixo .bcs-* — não conflita com componentes do app.
   ====================================================== */
.bcs-hero {
  position: relative;
  background:
    linear-gradient(135deg, rgba(13,122,94,.10) 0%, rgba(26,111,212,.06) 50%, transparent 100%),
    var(--surf);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 22px 26px 18px;
  margin-bottom: 14px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.bcs-hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 80% at 100% 0%, rgba(13,122,94,.08) 0%, transparent 55%),
    radial-gradient(ellipse 50% 70% at 0% 100%, rgba(26,111,212,.05) 0%, transparent 50%);
  pointer-events: none;
}
.bcs-hero-top {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
  flex-wrap: wrap;
  z-index: 1;
}
.bcs-hero-eyebrow {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--accent);
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.bcs-hero-eyebrow::before {
  content: '';
  width: 26px;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), transparent);
  border-radius: 2px;
}
.bcs-hero-title {
  font-family: var(--sans);
  font-size: 26px;
  font-weight: 800;
  letter-spacing: -0.4px;
  color: var(--text);
  margin-top: 8px;
  line-height: 1.15;
}
.bcs-hero-title em { font-style: normal; color: var(--accent); }
.bcs-hero-sub {
  margin-top: 8px;
  color: var(--text2);
  font-size: 13px;
  max-width: 640px;
  line-height: 1.55;
}
.bcs-hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.bcs-hero-meta {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
  margin-top: 4px;
}

.bcs-kpi-strip {
  position: relative;
  z-index: 1;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 10px;
  margin-top: 16px;
}
.bcs-kpi {
  position: relative;
  background: rgba(255, 255, 255, 0.65);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 14px 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  backdrop-filter: blur(2px);
  transition: transform .15s ease, box-shadow .15s ease;
}
.bcs-kpi:hover {
  transform: translateY(-1px);
  box-shadow: var(--shadow-sm);
}
.bcs-kpi .lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.bcs-kpi .lbl .ico {
  font-size: 12px;
  color: var(--text2);
}
.bcs-kpi .val {
  font-family: var(--mono);
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.1;
}
.bcs-kpi .extra {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--text2);
  margin-top: 2px;
}
.bcs-kpi.accent .val { color: var(--accent); }
.bcs-kpi.blue .val { color: var(--accent2); }
.bcs-kpi.orange .val { color: var(--accent3); }
.bcs-kpi.warn .val { color: var(--warn); }
.bcs-kpi.danger .val { color: var(--err); }

.bcs-tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  background: var(--surf);
  padding: 5px;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
}
.bcs-tab {
  text-decoration: none;
  padding: 8px 14px;
  border-radius: 8px;
  color: var(--text2);
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: .2px;
  transition: all .15s ease;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border: 1px solid transparent;
}
.bcs-tab:hover {
  background: var(--surf2);
  color: var(--accent);
}
.bcs-tab.active {
  background: linear-gradient(135deg, rgba(13,122,94,.13), rgba(26,111,212,.10));
  color: var(--accent);
  border-color: rgba(13,122,94,.22);
  box-shadow: 0 1px 2px rgba(13,122,94,.10);
}
.bcs-tab .tab-ico {
  font-size: 13px;
  width: 14px;
  text-align: center;
}

.bcs-section {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 14px;
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}
.bcs-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 18px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, var(--surf) 0%, var(--surf2) 100%);
}
.bcs-section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 13.5px;
  color: var(--text);
  letter-spacing: -.1px;
  margin: 0;
}
.bcs-section-title .ico {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(13,122,94,.10);
  color: var(--accent);
  font-size: 14px;
}
.bcs-section-title .ico.blue { background: rgba(26,111,212,.10); color: var(--accent2); }
.bcs-section-title .ico.warn { background: rgba(184,134,11,.12); color: var(--warn); }
.bcs-section-title .ico.orange { background: rgba(217,120,43,.12); color: var(--accent3); }
.bcs-section-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text2);
}
.bcs-section-body { padding: 18px; }
.bcs-section-body.tight { padding: 4px 0 0; }

.bcs-grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 16px;
}
@media (max-width: 980px) { .bcs-grid-2 { grid-template-columns: 1fr; } }

.bcs-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 16px;
}
@media (max-width: 1100px) { .bcs-grid-3 { grid-template-columns: 1fr; } }

.bcs-filter-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: flex-end;
}
.bcs-filter-row .field { margin: 0; min-width: 160px; }

.bcs-table { overflow: auto; }
.bcs-table table { width: 100%; border-collapse: collapse; }
.bcs-table thead th {
  text-align: left;
  padding: 11px 16px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surf2);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}
.bcs-table tbody td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 12.5px;
  vertical-align: middle;
}
.bcs-table tbody tr:hover { background: var(--surf2); }
.bcs-table tbody tr:last-child td { border-bottom: 0; }
.bcs-table .num { text-align: right; font-family: var(--mono); }
.bcs-table .ok-text { color: var(--accent); }
.bcs-table .err-text { color: var(--err); }

.bcs-thumb {
  width: 64px;
  height: 48px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--border);
  display: block;
  cursor: zoom-in;
  transition: transform .15s ease;
}
.bcs-thumb:hover { transform: scale(1.06); }

.bcs-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 8px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .3px;
}
.bcs-status-pill.ok { background: rgba(13,122,94,.12); color: var(--accent); }
.bcs-status-pill.err { background: rgba(198,40,65,.10); color: var(--err); }
.bcs-status-pill.warn { background: rgba(184,134,11,.14); color: var(--warn); }
.bcs-status-pill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 999px;
  background: currentColor;
}

.bcs-flash { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 12.5px; border: 1px solid; }
.bcs-flash.success { background: rgba(13,122,94,.10); border-color: rgba(13,122,94,.30); color: var(--accent); }
.bcs-flash.error { background: rgba(198,40,65,.08); border-color: rgba(198,40,65,.28); color: var(--err); }

.bcs-empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 12.5px;
}
.bcs-empty .icon { font-size: 36px; margin-bottom: 10px; opacity: .85; }
</style>
{%- endmacro %}

{% macro bcs_tabs(active='') -%}
<div class="bcs-tabs" role="tablist">
  <a class="bcs-tab {% if active == 'importar' %}active{% endif %}" href="{{ url_for('ecc_importar') }}">
    <span class="tab-ico">📥</span> Importar
  </a>
  <a class="bcs-tab {% if active == 'calibragem' %}active{% endif %}" href="{{ url_for('ecc_calibragem') }}">
    <span class="tab-ico">⚖️</span> Calibragem
  </a>
  <a class="bcs-tab {% if active == 'rebanho' %}active{% endif %}" href="{{ url_for('ecc_analise_rebanho') }}">
    <span class="tab-ico">🐄</span> Análise rebanho
  </a>
  <a class="bcs-tab {% if active == 'individual' %}active{% endif %}" href="{{ url_for('ecc_analise_individual') }}">
    <span class="tab-ico">🐂</span> Análise individual
  </a>
  <a class="bcs-tab {% if active == 'atencao' %}active{% endif %}" href="{{ url_for('ecc_pontos_atencao') }}">
    <span class="tab-ico">⚠️</span> Pontos de atenção
  </a>
</div>
{%- endmacro %}
