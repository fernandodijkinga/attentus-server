{% extends "base.html" %}
{% block title %}Black Barn — correlações{% endblock %}
{% block head %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
.corr-wrap{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
@media(max-width:960px){.corr-wrap{grid-template-columns:1fr}}
#cscatter{max-height:72vh}
.statline{font-family:var(--mono);font-size:12px;margin-top:8px;color:var(--text2)}
.corr-chart-wrap{position:relative;width:100%;min-height:380px}
</style>
{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <div class="page-title">⬛ <span>Black Barn</span> <span style="color:var(--accent)">correlações</span></div>
    <div class="page-sub">Scatter configurável · Pearson · Spearman · Kendall</div>
  </div>
  <a class="btn btn-ghost btn-sm" href="{{ url_for('black_barn_importar') }}">← Importar</a>
</div>
<div class="corr-wrap">
  <div class="card">
    <div class="card-title">Eixo X / Y</div>
    <div class="field">
      <label>Trait X</label>
      <select id="ax" style="width:100%">
        {% for t in trait_keys %}
        <option value="{{ t.id }}">{{ t.label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Trait Y</label>
      <select id="ay" style="width:100%">
        {% for t in trait_keys %}
        <option value="{{ t.id }}">{{ t.label }}</option>
        {% endfor %}
      </select>
    </div>
    <button class="btn btn-accent btn-sm" type="button" id="btnPlot">Atualizar gráfico</button>
    <div id="stats" class="statline"></div>
  </div>
  <div class="card">
    <div class="corr-chart-wrap">
      <canvas id="cscatter"></canvas>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  const url = {{ url_for('api_black_barn_correlation_points') | tojson }};
  const opts = document.querySelectorAll('#ax option');
  const selAy = document.getElementById('ay');
  const selAx = document.getElementById('ax');
  if (opts.length > 1 && selAy) selAy.selectedIndex = 1;
  let chart;
  async function plot(){
    const statsEl = document.getElementById('stats');
    const ax = selAx;
    if (!ax || !ax.options.length) {
      if (statsEl) statsEl.textContent = 'Nenhum trait disponível. Grave traits em segmentação / keypoints primeiro.';
      return;
    }
    const x = ax.value;
    const y = selAy ? selAy.value : '';
    if (!y || x === y) {
      if (statsEl) statsEl.textContent = 'Escolha dois traits diferentes (eixo X ≠ Y).';
      return;
    }
    if (statsEl) statsEl.textContent = 'A carregar…';
    try {
      if (typeof Chart === 'undefined') {
        if (statsEl) statsEl.textContent = 'Chart.js não carregou (rede / CDN). Verifique a ligação à Internet.';
        return;
      }
      const res = await fetch(url + '?x=' + encodeURIComponent(x) + '&y=' + encodeURIComponent(y), { credentials: 'same-origin' });
      const j = await res.json().catch(function () { return { _parse_error: true }; });
      if (!res.ok || j._parse_error) {
        if (statsEl) statsEl.textContent = 'Erro API: ' + (j.error || res.status + ' ' + res.statusText);
        return;
      }
      const pts = j.points || [];
      if (statsEl) {
        statsEl.textContent =
          'n=' + (j.n != null ? j.n : pts.length) +
          ' · Pearson=' + (j.pearson != null && j.pearson === j.pearson ? j.pearson : '—') +
          ' · Spearman=' + (j.spearman != null && j.spearman === j.spearman ? j.spearman : '—') +
          ' · Kendall=' + (j.kendall != null && j.kendall === j.kendall ? j.kendall : '—');
      }
      const data = pts.map(function (p) { return { x: p[0], y: p[1] }; });
      const canvas = document.getElementById('cscatter');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'scatter',
        data: { datasets: [{ label: x + ' vs ' + y, data: data, backgroundColor: 'rgba(26,111,212,0.55)', pointRadius: 5 }] },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: true } },
          scales: {
            x: { title: { display: true, text: j.label_x || x } },
            y: { title: { display: true, text: j.label_y || y } }
          }
        }
      });
    } catch (err) {
      console.error(err);
      if (statsEl) statsEl.textContent = 'Erro ao desenhar: ' + (err && err.message ? err.message : String(err));
    }
  }
  const btn = document.getElementById('btnPlot');
  if (btn) btn.addEventListener('click', function(){ plot().catch(function(e){ console.error(e); }); });
  if (selAx && selAx.options.length) plot().catch(function(e){ console.error(e); });
})();
</script>
{% endblock %}
